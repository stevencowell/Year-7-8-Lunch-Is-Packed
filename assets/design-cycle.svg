<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Lunch bag design cycle</title><desc id="d">Five connected stages: investigate, define, create, produce and evaluate.</desc><rect width="1200" height="650" rx="44" fill="#f8f1e7"/><path d="M210 325H990" stroke="#0f5c5e" stroke-width="22" stroke-linecap="round"/><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#0f5c5e"><circle cx="210" cy="325" r="105"/><circle cx="405" cy="325" r="105"/><circle cx="600" cy="325" r="105"/><circle cx="795" cy="325" r="105"/><circle cx="990" cy="325" r="105"/></g><g fill="#fff" font-size="30" font-weight="700"><text x="210" y="315">INVESTIGATE</text><text x="210" y="355">the need</text><text x="405" y="315">DEFINE</text><text x="405" y="355">criteria</text><text x="600" y="315">CREATE</text><text x="600" y="355">options</text><text x="795" y="315">PRODUCE</text><text x="795" y="355">safely</text><text x="990" y="315">EVALUATE</text><text x="990" y="355">evidence</text></g><text x="600" y="95" font-size="48" font-weight="700" fill="#173c42">DESIGN IS A LOOP, NOT A STRAIGHT LINE</text><path d="M990 470C990 560 210 560 210 470" fill="none" stroke="#db6b49" stroke-width="18" marker-end="url(#a)"/></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#db6b49"/></marker></defs></svg>
