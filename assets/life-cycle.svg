<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Reusable lunch bag life cycle</title><desc id="d">Raw material, manufacture, transport, use and care, repair and end of life form a cycle.</desc><rect width="1200" height="650" rx="44" fill="#fbf4dc"/><circle cx="600" cy="340" r="220" fill="none" stroke="#0f5c5e" stroke-width="24" stroke-dasharray="210 20"/><g font-family="Arial,sans-serif" text-anchor="middle" font-weight="700" fill="#173c42"><text x="600" y="75" font-size="48">THINK ACROSS THE WHOLE LIFE CYCLE</text><text x="600" y="315" font-size="42">KEEP IT USEFUL</text><text x="600" y="365" font-size="42">FOR LONGER</text><text x="600" y="595" font-size="28">RAW MATERIAL · MAKE · MOVE · USE &amp; CARE · REPAIR · END OF LIFE</text></g><g fill="#db6b49"><circle cx="600" cy="120" r="28"/><circle cx="790" cy="230" r="28"/><circle cx="790" cy="450" r="28"/><circle cx="600" cy="560" r="28"/><circle cx="410" cy="450" r="28"/><circle cx="410" cy="230" r="28"/></g></svg>
