<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Safe sewing workspace</title><desc id="d">A clear bench, controlled needle zone, stored pins, closed scissors and stable iron create a safe textile workspace.</desc><rect width="1200" height="650" rx="44" fill="#eef7f5"/><g font-family="Arial,sans-serif" fill="#173c42"><text x="600" y="72" text-anchor="middle" font-size="50" font-weight="700">A SAFE WORKSPACE MAKES THE HAZARDS VISIBLE</text><rect x="120" y="150" width="960" height="400" rx="30" fill="#fff" stroke="#0f5c5e" stroke-width="12"/><rect x="430" y="220" width="340" height="230" rx="28" fill="#dce9e7" stroke="#173c42" stroke-width="10"/><path d="M500 385V275H680V385" fill="none" stroke="#173c42" stroke-width="18"/><circle cx="592" cy="380" r="66" fill="#ffe0d4" stroke="#db6b49" stroke-width="8"/><text x="592" y="370" text-anchor="middle" font-size="25" font-weight="700">KEEP HANDS</text><text x="592" y="402" text-anchor="middle" font-size="25" font-weight="700">CLEAR</text><circle cx="250" cy="300" r="65" fill="#f0c66c"/><g stroke="#173c42" stroke-width="8"><path d="M220 280L190 210M245 280L235 200M270 280L290 205"/></g><text x="250" y="400" text-anchor="middle" font-size="28">pins stored</text><path d="M900 250L1010 390M1010 250L900 390" stroke="#173c42" stroke-width="18"/><text x="955" y="440" text-anchor="middle" font-size="28">scissors closed</text></g></svg>
