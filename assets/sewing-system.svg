<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">How a sewing machine moves and joins fabric</title><desc id="d">Upper thread and bobbin thread interlock while the presser foot holds fabric and feed dogs move it.</desc><rect width="1200" height="650" rx="44" fill="#f8f1e7"/><g font-family="Arial,sans-serif" fill="#173c42"><text x="600" y="70" text-anchor="middle" font-size="48" font-weight="700">FOUR PARTS WORK TOGETHER</text><rect x="180" y="190" width="840" height="260" rx="25" fill="#fff" stroke="#0f5c5e" stroke-width="12"/><path d="M600 130V350" stroke="#db6b49" stroke-width="12"/><path d="M565 170C510 230 520 330 600 350" fill="none" stroke="#c08a24" stroke-width="9"/><path d="M635 500C700 430 690 365 600 350" fill="none" stroke="#0f5c5e" stroke-width="9"/><rect x="470" y="300" width="260" height="28" rx="14" fill="#173c42"/><path d="M450 395H750" stroke="#db6b49" stroke-width="34"/><path d="M480 430L520 405L560 430L600 405L640 430L680 405L720 430" fill="none" stroke="#173c42" stroke-width="12"/><text x="245" y="245" font-size="32" font-weight="700">PRESSER FOOT</text><text x="245" y="285" font-size="27">holds fabric</text><text x="810" y="245" font-size="32" font-weight="700">NEEDLE</text><text x="810" y="285" font-size="27">carries upper thread</text><text x="245" y="505" font-size="32" font-weight="700">FEED DOGS</text><text x="245" y="545" font-size="27">move fabric</text><text x="810" y="505" font-size="32" font-weight="700">BOBBIN</text><text x="810" y="545" font-size="27">supplies lower thread</text></g></svg>
